<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arinze | Creative Developer</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet" />


    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0f2027;
            background: linear-gradient(to right, #2c5364, #203a43, #0f2027);
            color: #fff;
            padding: 40px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        header h1 {
            font-size: 3em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.2em;
            color: #ccc;
        }

        .skills {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }

        .skill {
            background: #1c1c1c;
            padding: 20px;
            border-radius: 10px;
        }

        .skill h3 {
            margin-bottom: 10px;
        }

        .bar {
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            height: 20px;
        }

        .fill {
            height: 100%;
            background: #00c6ff;
            width: 0;
            transition: width 2s ease-in-out;
        }

        .contact {
            background: #1c1c1c;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            margin: auto;
        }

        .contact h2 {
            margin-bottom: 20px;
        }

        .contact p {
            margin-bottom: 10px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: none;
            border-radius: 5px;
        }

        button {
            background: #00c6ff;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        footer {
            text-align: center;
            margin-top: 60px;
            color: #aaa;
        }
    </style>
</head>

<body>
    <header>
        <h1>Meet Arinze</h1>
        <p>Creative Developer | Designer | Builder</p>
    </header>

    <section class="skills">
        <div class="skill">
            <h3>Graphic Design</h3>
            <div class="bar">
                <div class="fill" style="width: 85%;"></div>
            </div>
        </div>
        <div class="skill">
            <h3>Web Development</h3>
            <div class="bar">
                <div class="fill" style="width: 90%;"></div>
            </div>
        </div>
        <div class="skill">
            <h3>App Builder</h3>
            <div class="bar">
                <div class="fill" style="width: 75%;"></div>
            </div>
        </div>
        <div class="skill">
            <h3>Game Developer</h3>
            <div class="bar">
                <div class="fill" style="width: 65%;"></div>
            </div>
        </div>
    </section>

    <section class="contact">
        <h2>Contact Me</h2>
        <p>📞 08037926024</p>
        <p>📧 manuelarinze001@gmail.com</p>
        <form action="https://formspree.io/f/xblqyolj" method="POST" id="contactForm">
            <input type="text" name="name" placeholder="Your Name" required />
            <input type="email" name="email" placeholder="Your Email" required />
            <textarea name="message" placeholder="Your Message" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </section>

    <footer>
        &copy; 2025 Arinze. All rights reserved.
    </footer>

    <script>
        window.onload = () => {
            document.querySelectorAll('.fill').forEach(bar => {
                bar.style.width = bar.style.width;
            });
        };
    </script>
</body>

</html>
